config:
  target: "http://localhost:3000"
  phases:
    - name: "Warm up"
      duration: 45
      arrivalRate: 1
      rampTo: 3
    - name: "Funnel traffic"
      duration: 180
      arrivalRate: 4
  defaults:
    headers:
      User-Agent: "todds-threads-artillery-storefront-flow"
  ensure:
    maxErrorRate: 1
    thresholds:
      - http.response_time.p95: 3000
      - http.response_time.p99: 7000

scenarios:
  - name: "Browse toward checkout without creating orders"
    flow:
      - get:
          url: "/en"
      - think: 1
      - get:
          url: "/en/products"
      - think: 2
      - get:
          url: "/en/search?q=patch"
      - think: 1
      - get:
          url: "/en/checkout"
      - think: 1
      - get:
          url: "/api/currency/presentation"
      - get:
          url: "/api/shipping/profiles"
      - post:
          url: "/api/discounts/preview"
          headers:
            Content-Type: "application/json"
          json:
            items: []
            email: "load-test@example.com"
      - get:
          url: "/api/shipping/sameday/counties"
      - get:
          url: "/api/shipping/sameday/cities?countyId=1"
